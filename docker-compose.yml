services:
  letta:
    image: letta/letta:latest
    container_name: novi_letta
    ports:
      - "8283:8283"
    environment:
      - LETTA_PG_URI=postgresql://novi_user:novi_password_2024@letta_db:5432/letta
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - SECURE=true
      - LETTA_SERVER_PASSWORD=${LETTA_SERVER_PASSWORD}
      - LETTA_ENCRYPTION_KEY=dummy-encryption-key-32-chars-long!!
    volumes:
      - letta_data:/root/.letta
    depends_on:
      letta_db:
        condition: service_healthy
    networks:
      - novi_network

  letta_db:
    image: pgvector/pgvector:pg16
    container_name: novi_letta_db
    environment:
      POSTGRES_USER: novi_user
      POSTGRES_PASSWORD: novi_password_2024
      POSTGRES_DB: letta
    volumes:
      - letta_pg_data:/var/lib/postgresql/data
      - ./pg_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novi_user -d letta"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - novi_network

  redis:
    image: redis:alpine
    container_name: novi_redis
    ports:
      - "6379:6379"
    networks:
      - novi_network

  mysql:
    image: mysql:8.0
    container_name: novi_mysql
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-@Rajendra5109}
      MYSQL_DATABASE: ${MYSQL_DB:-novi_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-@Rajendra5109}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - novi_network

volumes:
  letta_data:
  letta_pg_data:
  mysql_data:

networks:
  novi_network:
    driver: bridge
